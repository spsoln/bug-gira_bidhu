{# Expects: project, active #}
<a class="nav-item" href="{% url 'projects:project_list' %}" style="font-size: 12px; color: #7d8896; margin-bottom: 8px;">
    ← All Projects
</a>

<div class="sidebar-project-name" style="margin-bottom: 10px;">
    <span class="sidebar-project-key">{{ project.key }}</span>
    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ project.name }}</span>
</div>

<a class="nav-item {% if active == 'overview' %}active{% endif %}" href="{% url 'projects:project_detail' project.id %}">
    <span class="nav-icon">▦</span> All Tickets
</a>
<a class="nav-item {% if active == 'board' %}active{% endif %}" href="{% url 'projects:project_board' project.id %}">
    <span class="nav-icon">▤</span> Board
</a>
<a class="nav-item {% if active == 'backlog' %}active{% endif %}" href="{% url 'projects:project_backlog' project.id %}">
    <span class="nav-icon">≣</span> Backlog
</a>
<a class="nav-item {% if active == 'sprints' %}active{% endif %}" href="{% url 'projects:project_sprints' project.id %}">
    <span class="nav-icon">⏱</span> Sprints
</a>
