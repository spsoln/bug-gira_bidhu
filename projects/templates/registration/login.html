{% extends 'projects/base.html' %}

{% block title %}Login - BugGira{% endblock %}

{% block content %}
    <div style="max-width: 400px; margin: 60px auto;">
        <div class="card-box" style="padding: 32px;">
            <h1 style="margin-bottom: 8px;">Sign in</h1>
            <p style="color: #5e6c84; margin: 0 0 24px 0;">Welcome back to BugGira</p>

            {% if form.errors %}
                <div class="alert alert-error">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" required autofocus class="form-input">
                </div>

                <div class="form-group">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" required class="form-input">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
                    Sign in
                </button>
            </form>
        </div>
    </div>
{% endblock %}
